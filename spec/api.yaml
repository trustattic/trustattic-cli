info:
    title: BKP API
    version: v2
openapi: 3.0.3
paths:
    /account:
        get:
            operationId: AccountGet
            parameters:
                - $ref: '#/components/parameters/AuthHeader'
                - $ref: '#/components/parameters/TracingHeader'
                - $ref: '#/components/parameters/Pagination'
            responses:
                "200":
                    $ref: '#/components/responses/AccountPermissionsResponse'
                "401":
                    $ref: '#/components/responses/401Unauthorized'
                "409":
                    $ref: '#/components/responses/409Conflict'
                "500":
                    $ref: '#/components/responses/500InternalServerError'
            summary: Returns the current user's accounts
            tags:
                - account
        post:
            operationId: AccountPost
            parameters:
                - $ref: '#/components/parameters/AuthHeader'
                - $ref: '#/components/parameters/TracingHeader'
            requestBody:
                $ref: '#/components/requestBodies/AccountRequest'
            responses:
                "201":
                    $ref: '#/components/responses/AccountResponse'
                "400":
                    $ref: '#/components/responses/400BadRequest'
                "401":
                    $ref: '#/components/responses/401Unauthorized'
                "403":
                    $ref: '#/components/responses/403Forbidden'
                "409":
                    $ref: '#/components/responses/409Conflict'
                "500":
                    $ref: '#/components/responses/500InternalServerError'
            summary: Create a new account (only service accounts)
            tags:
                - account
        put:
            operationId: AccountPutObtain
            parameters:
                - $ref: '#/components/parameters/AuthHeader'
                - $ref: '#/components/parameters/TracingHeader'
            requestBody:
                $ref: '#/components/requestBodies/AccountObtainRequest'
            responses:
                "202":
                    $ref: '#/components/responses/AccountResponse'
                "400":
                    $ref: '#/components/responses/400BadRequest'
                "401":
                    $ref: '#/components/responses/401Unauthorized'
                "403":
                    $ref: '#/components/responses/403Forbidden'
                "404":
                    $ref: '#/components/responses/404NotFound'
                "409":
                    $ref: '#/components/responses/409Conflict'
                "500":
                    $ref: '#/components/responses/500InternalServerError'
            summary: Returns the current user's account; if AuthHeader token is not presented in the database, then the new account is created; if the account is INVITED, then the account is activated
            tags:
                - account
    /account/{account_id}:
        put:
            operationId: AccountPut
            parameters:
                - $ref: '#/components/parameters/AuthHeader'
                - $ref: '#/components/parameters/TracingHeader'
                - $ref: '#/components/parameters/AccountId'
            requestBody:
                $ref: '#/components/requestBodies/AccountRequest'
            responses:
                "202":
                    $ref: '#/components/responses/AccountResponse'
                "400":
                    $ref: '#/components/responses/400BadRequest'
                "401":
                    $ref: '#/components/responses/401Unauthorized'
                "403":
                    $ref: '#/components/responses/403Forbidden'
                "404":
                    $ref: '#/components/responses/404NotFound'
                "409":
                    $ref: '#/components/responses/409Conflict'
                "500":
                    $ref: '#/components/responses/500InternalServerError'
            summary: Create a new account (only service accounts)
            tags:
                - account
    /account/{account_id}/token:
        get:
